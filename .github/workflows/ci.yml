name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:app
      - run: npm run typecheck
      - run: node --experimental-strip-types --experimental-vm-modules --test tests/*.test.mjs
      - run: npm run build
      - name: Save verified release build
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  supabase:
    name: Supabase schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase services
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations from scratch
        run: supabase db reset
      - name: Lint database schema
        run: supabase db lint --level warning --fail-on warning
      - name: Verify Worker storage contract and access controls
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/worker-runtime.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/game-record.sql

  deploy:
    name: Deploy tagged production release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [app, supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: 48890562f463f171894825cde58e83f1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release and required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable version tag such as v1.0.0'; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Release commit must be merged into main'; exit 1; }
          for key in CLOUDFLARE_API_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "Missing required secret: $key"; exit 1; }
          done
          [[ "$SUPABASE_PROJECT_ID" == 'puiwukfftwbwkdsnpwuw' ]] || { echo 'Unexpected production project'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: dist
      - name: Verify Cloudflare credentials before migrations
        run: npx wrangler whoami
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview production migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply production migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy the verified Worker artifact
        run: npx wrangler deploy --config dist/server/wrangler.json --message "Release $GITHUB_REF_NAME ($GITHUB_SHA)"
      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for path in lobby practice; do
            curl --fail --silent --show-error --retry 3 --max-time 30 "https://janggi-crash.inspire12-dev.workers.dev/$path" --output /dev/null
          done
      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "Release: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo 'Service: https://janggi-crash.inspire12-dev.workers.dev/lobby'
            echo 'Logs: https://dash.cloudflare.com/48890562f463f171894825cde58e83f1/workers/services/view/janggi-crash/production/observability/events'
            echo 'Database migrations are not automatically rolled back on Worker deployment failure.'
          } >> "$GITHUB_STEP_SUMMARY"
