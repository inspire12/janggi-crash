name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:app
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/game-record.test.mjs
      - run: npm run build

  supabase:
    name: Supabase schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase services
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations from scratch
        run: supabase db reset
      - name: Lint database schema
        run: supabase db lint --level warning --fail-on warning
      - name: Verify Worker storage contract and access controls
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/worker-runtime.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/game-record.sql
